        - heading "1. 設置 HTML 元素" [level=5] [ref=e930]:  1. 設置 HTML 元素
        - list [ref=e931]:
          - listitem [ref=e932]: 使用記憶卡號和約定信用卡相關功能時，需要消費者勾選啟用與否，請預先設置產生核取方塊的 HTML 容器以及文案顯示位置
          - listitem [ref=e933]:
            - code [ref=e934]: for="type-checkbox"
            - text: 的設置可讓使用者點擊文字時同時點擊核取方塊
          - listitem [ref=e935]:
            - paragraph [ref=e936]:
              - text: 為配合
              - code [ref=e937]: payuniSDK.onUpdate
              - text: 顯⽰，可先將
              - code [ref=e938]: token_type_checkbox_area
              - text: 設定隱藏
            - code [ref=e940]:
              - generic [ref=e941]: "<div id=\"token_type_checkbox_area\" style=\"display: flex; align-items: center; display: none;\">"
              - generic [ref=e942]: "<div id=\"put_token_type\" style=\"display: flex; align-items: center;\">"
              - text: <!-- 按照 useTokenType 值決定是否在此容器產生 checkbox 選項-->
              - generic [ref=e943]: </div>
              - generic [ref=e944]: "<label id=\"token_type_text\" for=\"type-checkbox\" style=\"margin-left: 8px;\">"
              - text: <!-- 此區域您可放置 token_type_text 預設文字或是其他 -->
              - generic [ref=e945]: </label>
              - generic [ref=e946]: </div>
            - heading "2. 配置 SDK 初始化參數" [level=5] [ref=e947]:  2. 配置 SDK 初始化參數
            - paragraph [ref=e948]:
              - text: 在 SDK 初始化配置中綁定記憶卡號與約定信用卡使用的核取方塊的 HTML 容器
              - code [ref=e949]: id
            - code [ref=e951]: "const options = { ... elements: { CardNo: \"put_card_no\", CardExp: \"put_card_exp\", CardCvc: \"put_card_cvc\", CardTokenType: \"put_token_type\" // 新增此項 }, ... };"
            - heading "3. onUpdate 事件處理" [level=5] [ref=e952]:
              - text:  3.
              - code [ref=e953]: onUpdate
              - text: 事件處理
            - paragraph [ref=e954]:
              - text: 串接時若有傳送
              - code [ref=e955]: creditToken
              - text: 欲進行信用卡記憶卡號或約定信用卡交易時，
              - code [ref=e956]: onUpdate
              - text: 回傳的
              - code [ref=e957]: update.event
              - text: 為
              - code [ref=e958]: useTokenType
              - text: ，並可自
              - code [ref=e959]: update.data
              - text: 取得相關設定值。
            - code [ref=e961]:
              - text: payuniSDK.onUpdate(
              - generic [ref=e962]: function (update)
              - text: "{ const { status, event, data } = update; // 表單狀態處理 if (status) { // ... 表單驗證相關邏輯 // 若使用者要使用記憶過的卡號進行交易，可忽略 CardNo 為 null 的驗證狀態 } // 特定事件處理 if (event === \"useTokenType\") { // 獲取事件時才顯示 checkbox 區域元件 document.getElementById(\"token_type_checkbox_area\").style.display = \"flex\" // 啟用記憶卡號，且已綁定成功後，SDK 會在第二次開始，透過 cardNo 回傳綁定要快速結帳的記憶卡號 if (data.tokenType === \"2\" && data.cardNo !== null) { // 您可在此做相對應的畫面處理，例如在頁面顯示已綁定卡號並提供選取按鈕讓使用者自行決定是否使用此綁定卡號交易 } setTimeout(() => { // 顯示 checkbox 的文案 if (data.tokenTypeText) document.getElementById(\"token_type_text\").innerHTML = data.tokenTypeText }, 100) return } });"
          - listitem [ref=e963]:
            - paragraph [ref=e964]: "記憶卡號:"
            - list [ref=e965]:
              - listitem [ref=e966]:
                - text: 您可自行決定是否要顯示卡號輸入框讓使用者不使用記憶卡號而是重新輸入卡號，或是參考
                - link "詳細範例" [ref=e967] [cursor=pointer]:
                  - /url: https://github.com/payuni/UNiEmbed-uniPayment
              - listitem [ref=e968]:
                - text: SDK 會取得核取方塊的值，判斷是否要記憶卡號，請確保初始化參數的
                - code [ref=e969]: CardTokenType
                - text: 有設定顯示核取方塊的容器
                - code [ref=e970]: id
              - listitem [ref=e971]:
                - text: 若您串接時設定記憶卡號包含到期日，則 SDK 會將到期日自動帶入
                - code [ref=e972]: put_card_exp
                - text: 輸入框
              - listitem [ref=e973]:
                - code [ref=e974]: update.data
                - text: 回傳值
                - list [ref=e975]:
                  - listitem [ref=e976]:
                    - text: 第一次使用
                    - code [ref=e977]: creditToken
                    - text: 啟用信用卡記憶卡號時
                    - code [ref=e979]: "{ cardNo: null, tokenTypeText: \"記錄此張信用卡下次即可快速結帳\", tokenType: \"2\" }"
                  - listitem [ref=e980]:
                    - text: 同組
                    - code [ref=e981]: creditToken
                    - text: 第二次開始進行信用卡記憶卡號快速交易
                    - code [ref=e983]: "{ cardNo: \"414712******2716\", // 回傳經過隱碼的卡號 tokenTypeText: \"記錄此張信用卡下次即可快速結帳\", // 如果使用者要更新記憶卡號可搭配顯示選項文字 tokenType: \"2\" }"
          - listitem [ref=e984]:
            - text: 約定信用卡/強制約定信用卡
            - list [ref=e985]:
              - listitem [ref=e986]:
                - text: 在一般約定信用卡時，SDK 會取得核取方塊的值，判斷使用者是否同意使用約定信用卡交易，請確保初始化參數的
                - code [ref=e987]: CardTokenType
                - text: 有設定顯示核取方塊的容器
                - code [ref=e988]: id
              - listitem [ref=e989]:
                - code [ref=e990]: update.data
                - text: 回傳值
                - list [ref=e991]:
                  - listitem [ref=e992]:
                    - text: 約定信用卡交易
                    - code [ref=e994]: "{ cardNo: null, tokenTypeText:\"本次交易完成後，商店即可透過 PAYUNi 平台綁定信用卡以方便您日後付款，您的卡號將於 PAYUNI 平台加密存放，商店無法取得您的完整卡號，請安心交易。\", tokenType: \"1\" }"
                  - listitem [ref=e995]:
                    - text: 強制約定信用卡交易
                    - list [ref=e996]:
                      - listitem [ref=e997]:
                        - text: 使用強制約定時將不產生核取方塊，強制進行約定信用卡綁定，你可自行決定是否顯示
                        - code [ref=e998]: tokenTypeText
                        - code [ref=e1000]: "{ cardNo: null, tokenTypeText: \"本次交易完成後，商店即可透過 PAYUNi 平台綁定信用卡以方便您日後付款，您的卡號將於 PAYUNI 平台加密存放，商店無法取得您的完整卡號，請安心交易。\", tokenType: \"3\" }"
        - heading "4. 使用信用卡記憶卡號交易" [level=5] [ref=e1001]:  4. 使用信用卡記憶卡號交易
        - paragraph [ref=e1002]:
          - text: 當使用
          - code [ref=e1003]: getTradeResult
          - text: 時, 可以在帶入參數 config 加入
          - code [ref=e1004]: useDefault
          - text: (boolean, 預設為 false)
          - text: 當其值為
          - code [ref=e1005]: "true"
          - text: 時, 並且
          - code [ref=e1006]: useTokenType
          - text: 事件的 data 含有
          - code [ref=e1007]: cardNo
          - text: 時, 就會使用原本快速記憶過的信用卡 (不會管
          - code [ref=e1008]: CardNo
          - text: 的 input 值)。
        - code [ref=e1010]:
          - text: async
          - generic [ref=e1011]:
            - text: function processPayment(
            - text: )
          - text: "{ try { const result = await payuniSDK.getTradeResult({ useDefault: true // 設置 true 為 要使用 記憶過的信用卡 }); console.log(\"取得信用卡號綁定 TOKEN 結果:\", result); // 取得成功後再將原始的 TOKEN 進行幕後交易授權 } catch (error) { console.error(\"信用卡號綁定 TOKEN 失敗:\", error); // 建議於此處進行 Error Handle } }"
