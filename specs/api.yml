            schema:
              type: object
              description: 結帳表單欄位資料
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

# ============================================================
# Components
# ============================================================
components:
  schemas:
    PayuniEncryptedRequest:
      type: object
      description: PayUni AES 加密的請求格式
      required: [MerID, EncryptInfo, HashInfo]
      properties:
        MerID:
          type: string
          description: 商店代號
        Version:
          type: string
          description: API 版本
        EncryptInfo:
          type: string
          description: AES-CBC 加密的交易資料
        HashInfo:
          type: string
          description: SHA256 雜湊驗證碼

    PayuniDecryptedTradeResult:
      type: object
      description: PayUni 解密後的交易結果（v3 Webhook）
      properties:
        Status:
          type: string
          description: 交易狀態（SUCCESS/其他錯誤碼）
        Message:
          type: string
          description: 狀態說明
        MerID:
          type: string
          description: 商店代號
        MerTradeNo:
          type: string
          description: 商店訂單編號（格式：{order_id}-{suffix}）
        Gateway:
          type: string
          description: 交易通道
        TradeNo:
          type: string
          description: PAYUNi 交易編號
        TradeAmt:
          type: string
          description: 交易金額
        TradeStatus:
          type: string
          description: 交易狀態
        PaymentType:
          type: string
          description: 付款方式
        CardBank:
          type: string
          description: 發卡銀行代碼
        Card6No:
          type: string
          description: 卡號前六碼
        Card4No:
          type: string
          description: 卡號末四碼
        CardInst:
          type: string
          description: 分期期數
        FirstAmt:
          type: string
          description: 首期金額
        EachAmt:
          type: string
          description: 每期金額
        ResCode:
          type: string
          description: 回應碼
        ResCodeMsg:
          type: string
          description: 回應碼說明
        AuthCode:
          type: string
          description: 授權碼
        AuthBank:
          type: string
          description: 收單銀行
        AuthBankName:
          type: string
          description: 收單銀行名稱
        AuthType:
          type: string
          description: 授權類型（1=一次授權）
        AuthDay:
          type: string
          description: 授權日期
        AuthTime:
          type: string
          description: 授權時間
        CreditHash:
          type: string
          description: 信用卡 Hash（用於記憶卡號）
        CreditLife:
          type: string
          description: 信用卡有效期（MMYY）

    WpAjaxResponse:
      type: object
      description: WordPress AJAX 標準回應格式
      properties:
        success:
          type: boolean
        data:
          oneOf:
            - type: string
            - type: object

  securitySchemes:
    wordpressNonce:
      type: apiKey
      in: header
      name: X-WP-Nonce
      description: WordPress AJAX nonce 驗證（後台 AJAX 端點）
    wcApiSignature:
      type: apiKey
      in: query
      name: CheckMacValue
      description: WooCommerce API 回調簽章驗證（由各金流服務商提供）
