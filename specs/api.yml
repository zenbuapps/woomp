      summary: 結帳頁自動儲存資料
      description: |
        前台結帳頁自動儲存使用者填寫的資料至 transient。
        Transient key：`woomp_temp_{user_id}`，有效期 12 小時。
        註冊位置：`transient.php` → `wp_ajax_nopriv_checkout_autosave`
